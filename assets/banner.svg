<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .orbit-particle-1 {
        animation: orbit1 8s linear infinite;
        transform-origin: 1010px 180px;
      }
      .orbit-particle-2 {
        animation: orbit2 12s linear infinite;
        transform-origin: 1010px 180px;
      }
      .scan-beam {
        animation: scan 4s ease-in-out infinite alternate;
      }
      .wave-bar-1 { animation: wave 1.6s ease-in-out infinite alternate; }
      .wave-bar-2 { animation: wave 1.2s ease-in-out 0.2s infinite alternate; }
      .wave-bar-3 { animation: wave 1.8s ease-in-out 0.4s infinite alternate; }
      .wave-bar-4 { animation: wave 1.4s ease-in-out 0.1s infinite alternate; }
      .wave-bar-5 { animation: wave 1.7s ease-in-out 0.5s infinite alternate; }

      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes orbit1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbit2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes scan {
        0% { transform: translateY(-15px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(15px); opacity: 0.3; }
      }
      @keyframes wave {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />

  <!-- Technical Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="1010" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="80" r="90" fill="#818cf8" opacity="0.1" filter="url(#glow)" />

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="71" r="5" fill="#38bdf8" />
    <text x="32" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">CURATED PLATFORMS &amp; TOOLS</text>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#primary-grad)">Awesome SEO</text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Content Optimization</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      NLP Content Scoring • SERP Competitor Analysis • Topic Briefs • GEO / AEO AI Visibility
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">⚡ SERP Scoring</text>

      <!-- Tag 2 -->
      <rect x="122" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="134" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#818cf8">🧠 NLP &amp; Entities</text>

      <!-- Tag 3 -->
      <rect x="264" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="276" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c084fc">🤖 GEO / AEO Search</text>

      <!-- Tag 4 -->
      <rect x="406" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="418" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#34d399">📦 Open-Source</text>
    </g>
  </g>

  <!-- Right Visual / Interactive Graphic -->
  <g transform="translate(980, 180)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-dasharray="6 6" stroke-width="1.5" />
    <!-- Inner Orbit Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />

    <!-- Core Score Dial Card -->
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#soft-shadow)" />

    <!-- Pulse Score Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#primary-grad)" stroke-width="6" stroke-dasharray="210 60" stroke-linecap="round" transform="rotate(-90)" />

    <!-- Central SEO Score Text -->
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">98</text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">SCORE / 100</text>

    <!-- Scanning Radar Line -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="orbit-particle-1" />

    <!-- Orbiting Entity Nodes -->
    <g class="orbit-particle-1">
      <circle cx="0" cy="-110" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="-110" r="4" fill="#38bdf8" />
      <text x="14" y="-106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">SERP #1</text>
    </g>

    <g class="orbit-particle-2">
      <circle cx="110" cy="0" r="9" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <circle cx="110" cy="0" r="3.5" fill="#c084fc" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c084fc">AI Citation</text>
    </g>

    <g class="orbit-particle-1">
      <circle cx="-95" cy="55" r="8" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle cx="-95" cy="55" r="3" fill="#34d399" />
    </g>

    <!-- Mini Dynamic Audio / Frequency Bars at Bottom -->
    <g transform="translate(-32, 85)" fill="#38bdf8">
      <rect x="0" y="0" width="8" height="24" rx="3" transform="scale(1, 0.7)" class="wave-bar-1" />
      <rect x="14" y="0" width="8" height="24" rx="3" transform="scale(1, 0.9)" class="wave-bar-2" />
      <rect x="28" y="0" width="8" height="24" rx="3" transform="scale(1, 0.5)" class="wave-bar-3" />
      <rect x="42" y="0" width="8" height="24" rx="3" transform="scale(1, 1)" class="wave-bar-4" />
      <rect x="56" y="0" width="8" height="24" rx="3" transform="scale(1, 0.6)" class="wave-bar-5" />
    </g>
  </g>
</svg>
